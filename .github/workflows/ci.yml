name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 系统（nsh Linux 后端）
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libglib2.0-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang
      - name: 安装 huacnlee/cargo 分支（共享 target、免清理）
        run: |
          curl -fsSL https://github.com/huacnlee/cargo/releases/download/v0.103.0-1/install.sh | sh -s -- --version v0.103.0-1 --no-guard
          cargo --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "harn -> target\ncompanion -> target"
      - name: bootstrap（拉取 nsh 源码）
        run: ./bootstrap.sh
      - name: fmt
        run: cargo fmt --all --manifest-path harn/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --all --manifest-path harn/Cargo.toml --all-targets -- -D warnings
      - name: harn test
        run: cargo test --manifest-path harn/Cargo.toml --workspace
      - name: companion clippy
        run: cargo clippy --manifest-path companion/Cargo.toml --all-targets -- -D warnings
      - name: companion test
        run: cargo test --manifest-path companion/Cargo.toml

  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: 系统（host runner 构建需要 glib/gtk 开发头）
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libglib2.0-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK（platforms;android-35、build-tools、NDK r27c）
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf /tmp/clt /tmp/clt.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.1" "ndk;27.0.12077973"
      - name: nsh CLI + android 组件
        run: |
          curl -sL https://github.com/longbridge/nsh/releases/latest/download/nsh-linux-x86_64.tar.gz | tar xz -C /tmp
          /tmp/nsh/bin/nsh --version
          /tmp/nsh/bin/nsh component add android
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "harn -> target\ncompanion -> target"
          key: android
      - name: bootstrap（拉取 nsh 源码）
        run: ./bootstrap.sh
      - name: 打包 APK（arm64-v8a）
        working-directory: companion
        run: /tmp/nsh/bin/nsh package --target android --abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: companion-android-apk
          path: companion/.nsh/out/*.apk
          if-no-files-found: error
