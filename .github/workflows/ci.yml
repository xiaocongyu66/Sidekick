name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 系统（nsh Linux 后端）
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libglib2.0-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang
      - name: 安装 huacnlee/cargo 分支（共享 target、免清理）
        run: |
          curl -fsSL https://github.com/huacnlee/cargo/releases/download/v0.103.0-1/install.sh | sh -s -- --version v0.103.0-1 --no-guard
          cargo --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "harn -> target\ncompanion -> target"
      - name: bootstrap（拉取 nsh 源码）
        run: ./bootstrap.sh
      - name: fmt
        run: cargo fmt --all --manifest-path harn/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --all --manifest-path harn/Cargo.toml --all-targets -- -D warnings
      - name: harn test
        run: cargo test --manifest-path harn/Cargo.toml --workspace
      - name: companion clippy
        run: cargo clippy --manifest-path companion/Cargo.toml --all-targets -- -D warnings
      - name: companion test
        run: cargo test --manifest-path companion/Cargo.toml
